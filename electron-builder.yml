appId: com.fmoptimize
productName: FM Optimize
directories:
  buildResources: resources
  output: dist
extraResources:
  - from: resources/
    to: ./
    filter:
      - "*.json"
      - "*.ico"
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
win:
  executableName: fm-optimize
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: fm-optimize-setup.${ext}
  shortcutName: FM Optimize
  uninstallDisplayName: FM Optimize
  createDesktopShortcut: always
publish:
  provider: github
  owner: FelipeMeloGomes
  repo: FM_Optimization
