appId: com.fmoptimize
productName: FM Optimize
directories:
  buildResources: resources
  output: dist
extraResources:
  - from: resources/
    to: ./
    filter:
      - "*.json"
      - "*.ico"
files:
  # Whitelist explícita: sem isto o default `**/*` empacotava o repositório
  # inteiro (data/, docs/, .env.local), inflando o app.asar em ~380 MB.
  - out/**/*
  - package.json
  - node_modules/**/*
  - '!**/*.tsbuildinfo'
  - '!**/*.map'
  - '!**/.env*'
  # Alguns pacotes publicam o código-fonte TS junto (o zod traz 3 MB em
  # `src/v4/**/*.ts`, testes inclusive). Nada disso é executado: a entrada do
  # zod é `index.cjs`. O filtro NÃO pode ser genérico — o pacote `debug` usa
  # `src/index.js` como `main` e quebraria o boot do main process.
  - '!**/node_modules/zod/src/**'
# Remove dxcompiler.dll (24,6 MB) depois de copiar o runtime do Electron.
afterPack: scripts/after-pack.cjs
# Mantém apenas os locales que o app usa (padrão copiava os 48 = ~49 MB).
electronLanguages:
  - pt-BR
  - en-US
compression: maximum
win:
  executableName: fm-optimize
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: fm-optimize-setup.${ext}
  shortcutName: FM Optimize
  uninstallDisplayName: FM Optimize
  createDesktopShortcut: always
publish:
  provider: github
  owner: FelipeMeloGomes
  repo: FM_Optimization
