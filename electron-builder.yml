appId: com.fmoptimize
productName: FM Optimize
directories:
  buildResources: resources
  output: dist
extraResources:
  - from: resources/
    to: ./
    filter:
      - "*.json"
      - "*.ico"
files:
  # Whitelist explícita: sem isto o default `**/*` empacotava o repositório
  # inteiro (data/, docs/, .env.local), inflando o app.asar em ~380 MB.
  - out/**/*
  - package.json
  - node_modules/**/*
  - '!**/*.tsbuildinfo'
  - '!**/*.map'
  - '!**/.env*'
# Mantém apenas os locales que o app usa (padrão copiava os 48 = ~49 MB).
electronLanguages:
  - pt-BR
  - en-US
compression: maximum
win:
  executableName: fm-optimize
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: fm-optimize-setup.${ext}
  shortcutName: FM Optimize
  uninstallDisplayName: FM Optimize
  createDesktopShortcut: always
publish:
  provider: github
  owner: FelipeMeloGomes
  repo: FM_Optimization
