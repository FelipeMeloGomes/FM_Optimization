<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bench" x1="600" y1="350" x2="1120" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2c3a4b" />
      <stop offset="0.5" stop-color="#16212d" />
      <stop offset="1" stop-color="#080e16" />
    </linearGradient>
    <linearGradient id="pcb" x1="700" y1="330" x2="1060" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17524e" />
      <stop offset="0.55" stop-color="#0c3333" />
      <stop offset="1" stop-color="#061b21" />
    </linearGradient>
    <linearGradient id="iron" x1="720" y1="190" x2="1020" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2e8f0" />
      <stop offset="0.3" stop-color="#8492a2" />
      <stop offset="0.65" stop-color="#334155" />
      <stop offset="1" stop-color="#0b1118" />
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e2e8f0" />
      <stop offset="0.5" stop-color="#8492a2" />
      <stop offset="1" stop-color="#3c4958" />
    </linearGradient>
    <linearGradient id="tip" x1="880" y1="300" x2="920" y2="356" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc" />
      <stop offset="0.5" stop-color="#94a3b8" />
      <stop offset="1" stop-color="#d4d4d8" />
    </linearGradient>
    <linearGradient id="rgb" x1="660" y1="420" x2="1080" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <filter id="ambient" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <pattern id="traces" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 12h8l4-4h12" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="1.4" />
      <circle cx="12" cy="8" r="1.4" fill="#67e8f9" fill-opacity="0.4" />
    </pattern>
  </defs>

  <ellipse cx="880" cy="310" rx="290" ry="120" fill="#22d3ee" fill-opacity="0.06" filter="url(#ambient)" />
  <ellipse cx="880" cy="455" rx="280" ry="24" fill="#000814" fill-opacity="0.85" filter="url(#ambient)" />

  <g transform="rotate(-5 880 320)">
    <!-- bancada -->
    <path d="M620 356h500c14 0 24 10 24 24v66c0 14-10 24-24 24H620c-14 0-24-10-24-24v-66c0-14 10-24 24-24z" fill="url(#bench)" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="2" />
    <path d="M596 380h548v14H596z" fill="#ffffff" fill-opacity="0.07" />
    <rect x="600" y="452" width="540" height="8" rx="4" fill="url(#rgb)" fill-opacity="0.55" />

    <!-- placa sobre a bancada -->
    <path d="M688 348h336c10 0 18 8 18 18v62c0 10-8 18-18 18H688c-10 0-18-8-18-18v-62c0-10 8-18 18-18z" fill="url(#pcb)" stroke="#67e8f9" stroke-opacity="0.4" stroke-width="2" />
    <rect x="680" y="356" width="352" height="82" rx="4" fill="url(#traces)" />
    <g fill="#0a1018" stroke="#94a3b8" stroke-opacity="0.4">
      <rect x="706" y="366" width="56" height="30" rx="3" />
      <rect x="776" y="366" width="36" height="30" rx="3" />
      <rect x="826" y="366" width="74" height="30" rx="3" />
      <rect x="914" y="366" width="46" height="30" rx="3" />
      <rect x="974" y="366" width="38" height="30" rx="3" />
    </g>
    <g stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1.5">
      <path d="M712 372h44M712 378h44M712 384h44M832 372h62M832 378h62M832 384h62" />
    </g>
    <g fill="#c9a24c">
      <circle cx="900" cy="414" r="4" />
      <circle cx="914" cy="414" r="4" />
      <circle cx="928" cy="414" r="4" />
      <circle cx="942" cy="414" r="4" />
    </g>
    <circle cx="694" cy="414" r="8" fill="#07131a" stroke="#c9a24c" stroke-width="2" />

    <!-- ponto de solda aquecido -->
    <circle cx="900" cy="378" r="22" fill="#22d3ee" fill-opacity="0.25" filter="url(#glow)" />
    <circle cx="900" cy="378" r="5" fill="#f8fafc" />
    <circle cx="900" cy="378" r="2" fill="#22d3ee" />
    <path d="M900 366c-8-12 4-18-2-30M912 368c10-10 0-18 6-28" stroke="#e2e8f0" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

    <!-- ferro de solda -->
    <g transform="rotate(38 820 278)">
      <rect x="724" y="214" width="180" height="52" rx="26" fill="url(#iron)" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="2.5" />
      <rect x="736" y="222" width="18" height="36" rx="9" fill="#0a1018" opacity="0.75" />
      <rect x="838" y="222" width="12" height="36" rx="6" fill="#22d3ee" fill-opacity="0.5" />
      <rect x="860" y="222" width="6" height="36" rx="3" fill="#ffffff" fill-opacity="0.2" />
      <rect x="904" y="226" width="64" height="28" rx="14" fill="#334155" stroke="#cbd5e1" stroke-opacity="0.35" />
      <rect x="968" y="234" width="42" height="12" rx="6" fill="url(#tip)" />
      <path d="M1010 236l18 4-18 6z" fill="#e2e8f0" />
      <path d="M742 220h152" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
      <circle cx="768" cy="240" r="4" fill="#22d3ee" />
    </g>

    <!-- parafusos soltos na bancada -->
    <g fill="url(#steel)">
      <circle cx="646" cy="402" r="7" />
      <circle cx="1100" cy="412" r="6" />
    </g>
    <g stroke="#0a1018" stroke-width="1.5">
      <path d="M642 402h8M1097 412h6" />
    </g>
  </g>
</svg>
