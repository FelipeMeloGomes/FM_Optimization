<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="drive" x1="700" y1="240" x2="1060" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2e8f0" />
      <stop offset="0.2" stop-color="#94a3b8" />
      <stop offset="0.5" stop-color="#475569" />
      <stop offset="0.75" stop-color="#b8c4d2" />
      <stop offset="1" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#64748b" />
      <stop offset="1" stop-color="#0b1118" />
    </linearGradient>
    <linearGradient id="cable" x1="620" y1="320" x2="720" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b2635" />
      <stop offset="0.5" stop-color="#0a1018" />
      <stop offset="1" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="rgb" x1="700" y1="420" x2="1080" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <filter id="ambient" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <pattern id="brushed" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 1h6M0 4h6" stroke="#ffffff" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <ellipse cx="875" cy="310" rx="290" ry="120" fill="#22d3ee" fill-opacity="0.06" filter="url(#ambient)" />
  <ellipse cx="880" cy="450" rx="275" ry="25" fill="#000814" fill-opacity="0.85" filter="url(#ambient)" />

  <g transform="rotate(-6 880 320)">
    <!-- cabo USB -->
    <path d="M704 318c-58 8-86 42-78 96" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="18" filter="url(#glow)" />
    <path d="M704 318c-58 8-86 42-78 96" stroke="url(#cable)" stroke-width="14" stroke-linecap="round" />
    <path d="M704 318c-58 8-86 42-78 96" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6" />
    <g transform="translate(606 404) rotate(12)">
      <rect x="0" y="0" width="42" height="20" rx="3" fill="url(#edge)" stroke="#94a3b8" stroke-opacity="0.5" />
      <rect x="6" y="4" width="30" height="8" rx="2" fill="#cbd5e1" />
      <rect x="10" y="6" width="22" height="4" rx="1" fill="#1b2635" />
    </g>

    <!-- corpo do HD de backup -->
    <path d="M712 244h332c18 0 32 14 32 32v116c0 18-14 32-32 32H712c-18 0-32-14-32-32V276c0-18 14-32 32-32z" fill="url(#drive)" stroke="#e2e8f0" stroke-opacity="0.4" stroke-width="2.5" />
    <rect x="680" y="244" width="396" height="180" rx="32" fill="url(#brushed)" />
    <path d="M712 244h332c18 0 32 14 32 32v14H680v-14c0-18 14-32 32-32z" fill="#ffffff" fill-opacity="0.22" />
    <path d="M684 292h388" stroke="#ffffff" stroke-opacity="0.25" stroke-width="5" />
    <path d="M684 408h388" stroke="#000814" stroke-opacity="0.3" stroke-width="8" />

    <!-- etiqueta de backup -->
    <g transform="rotate(-3 900 340)">
      <rect x="800" y="300" width="200" height="76" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
      <rect x="800" y="300" width="200" height="10" rx="5" fill="url(#rgb)" />
      <text x="900" y="330" fill="#1e293b" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">BACKUP / RP</text>
      <text x="900" y="350" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle" letter-spacing="1">PONTO DE RESTAURAÇÃO</text>
      <path d="M812 362h176" stroke="#94a3b8" stroke-width="1.5" />
      <g stroke="#64748b" stroke-width="1.5">
        <path d="M820 368v6M832 368v6M844 368v6M856 368v6M868 368v6M880 368v6M892 368v6M904 368v6M916 368v6M928 368v6M940 368v6M952 368v6M964 368v6M976 368v6" />
      </g>
    </g>
    <rect x="706" y="314" width="76" height="26" rx="5" fill="#0b1118" stroke="#cbd5e1" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="744" y="331" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" letter-spacing="1">RESTORE</text>

    <!-- selo circular de histórico e LED -->
    <g transform="translate(760 384)">
      <circle cx="0" cy="0" r="19" fill="#0b1118" stroke="url(#rgb)" stroke-width="2.5" />
      <path d="M0-9v10l7 5" stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="19" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="6" filter="url(#glow)" />
    </g>
    <rect x="804" y="388" width="112" height="6" rx="3" fill="url(#rgb)" />
    <g fill="#0a1018" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.5">
      <circle cx="700" cy="264" r="5" />
      <circle cx="1056" cy="264" r="5" />
      <circle cx="700" cy="404" r="5" />
      <circle cx="1056" cy="404" r="5" />
    </g>
  </g>
</svg>
