<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="shell" x1="690" y1="220" x2="1080" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a4656" />
      <stop offset="0.45" stop-color="#18222f" />
      <stop offset="1" stop-color="#070d15" />
    </linearGradient>
    <linearGradient id="cup" x1="700" y1="250" x2="900" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#455468" />
      <stop offset="0.5" stop-color="#253242" />
      <stop offset="1" stop-color="#0d1520" />
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2b3442" />
      <stop offset="0.5" stop-color="#121a24" />
      <stop offset="1" stop-color="#05090f" />
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f5f9" />
      <stop offset="0.45" stop-color="#8492a2" />
      <stop offset="1" stop-color="#3c4958" />
    </linearGradient>
    <linearGradient id="rgb" x1="660" y1="420" x2="1090" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <filter id="ambient" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <pattern id="mesh" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.8" fill="#050a11" />
      <circle cx="7" cy="7" r="1.8" fill="#050a11" />
    </pattern>
  </defs>

  <ellipse cx="880" cy="310" rx="300" ry="120" fill="#22d3ee" fill-opacity="0.06" filter="url(#ambient)" />
  <ellipse cx="880" cy="455" rx="270" ry="25" fill="#000814" fill-opacity="0.85" filter="url(#ambient)" />

  <g transform="rotate(-5 880 320)">
    <!-- cabo trançado -->
    <path d="M704 322c-56 12-84 48-74 104" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="20" filter="url(#glow)" />
    <path d="M704 322c-56 12-84 48-74 104" stroke="#0a1018" stroke-width="14" stroke-linecap="round" />
    <path d="M704 322c-56 12-84 48-74 104" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6" />
    <g transform="translate(610 412) rotate(12)">
      <rect x="0" y="0" width="40" height="18" rx="4" fill="url(#metal)" />
      <rect x="8" y="5" width="24" height="8" rx="2" fill="#1b2635" />
    </g>

    <!-- arco da cabeça -->
    <path d="M722 296c6-84 60-124 158-124s152 40 158 124" stroke="#0a1018" stroke-width="34" stroke-linecap="round" fill="none" />
    <path d="M722 296c6-84 60-124 158-124s152 40 158 124" stroke="url(#shell)" stroke-width="26" stroke-linecap="round" fill="none" />
    <path d="M730 280c12-72 62-104 150-104" stroke="#ffffff" stroke-opacity="0.2" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M742 286c8-62 52-92 138-92" stroke="url(#rgb)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glow)" />
    <path d="M742 286c8-62 52-92 138-92" stroke="url(#rgb)" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- almofada interna do arco -->
    <path d="M760 262c14-50 58-72 120-72s106 22 120 72" stroke="url(#cushion)" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- haste esquerda -->
    <path d="M724 272v50" stroke="url(#metal)" stroke-width="11" stroke-linecap="round" />
    <path d="M1036 272v50" stroke="url(#metal)" stroke-width="11" stroke-linecap="round" />

    <!-- copa esquerda -->
    <g transform="rotate(-6 714 346)">
      <path d="M668 300h92c16 0 28 12 28 28v52c0 16-12 28-28 28h-92c-16 0-28-12-28-28v-52c0-16 12-28 28-28z" fill="url(#cup)" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="2.5" />
      <path d="M668 300h92c16 0 28 12 28 28v10H640v-10c0-16 12-28 28-28z" fill="#ffffff" fill-opacity="0.16" />
      <rect x="652" y="312" width="92" height="76" rx="22" fill="url(#cushion)" stroke="#64748b" stroke-opacity="0.5" stroke-width="2" />
      <rect x="660" y="320" width="76" height="60" rx="18" fill="url(#mesh)" />
      <circle cx="730" cy="350" r="24" fill="#0a1018" stroke="url(#rgb)" stroke-width="3" />
      <circle cx="730" cy="350" r="24" stroke="url(#rgb)" stroke-width="8" stroke-opacity="0.5" filter="url(#glow)" />
      <text x="730" y="354" fill="#a5f3fc" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">L</text>
    </g>

    <!-- copa direita -->
    <g transform="rotate(6 1046 346)">
      <path d="M1000 300h92c16 0 28 12 28 28v52c0 16-12 28-28 28h-92c-16 0-28-12-28-28v-52c0-16 12-28 28-28z" fill="url(#cup)" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="2.5" />
      <path d="M1000 300h92c16 0 28 12 28 28v10H972v-10c0-16 12-28 28-28z" fill="#ffffff" fill-opacity="0.16" />
      <rect x="996" y="312" width="92" height="76" rx="22" fill="url(#cushion)" stroke="#64748b" stroke-opacity="0.5" stroke-width="2" />
      <rect x="1004" y="320" width="76" height="60" rx="18" fill="url(#mesh)" />
      <circle cx="1062" cy="350" r="24" fill="#0a1018" stroke="url(#rgb)" stroke-width="3" />
      <circle cx="1062" cy="350" r="24" stroke="url(#rgb)" stroke-width="8" stroke-opacity="0.5" filter="url(#glow)" />
      <text x="1062" y="354" fill="#a5f3fc" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">R</text>
    </g>

    <!-- microfone boom -->
    <path d="M986 392c-30 36-76 42-136 22" stroke="#0a1018" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M986 392c-30 36-76 42-136 22" stroke="url(#metal)" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M986 392c-30 36-76 42-136 22" stroke="url(#rgb)" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="5 5" fill="none" />
    <g transform="rotate(-18 838 416)">
      <rect x="814" y="402" width="48" height="28" rx="12" fill="url(#shell)" stroke="#cbd5e1" stroke-opacity="0.45" stroke-width="2" />
      <rect x="820" y="408" width="36" height="16" rx="8" fill="url(#mesh)" />
      <circle cx="838" cy="416" r="5" fill="#22d3ee" filter="url(#glow)" />
      <circle cx="838" cy="416" r="2.5" fill="#a5f3fc" />
    </g>

    <!-- detalhes e brilho -->
    <rect x="742" y="420" width="280" height="6" rx="3" fill="url(#rgb)" fill-opacity="0.6" filter="url(#glow)" />
    <rect x="742" y="420" width="280" height="6" rx="3" fill="url(#rgb)" />
    <g fill="#0a1018" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1.5">
      <circle cx="880" cy="206" r="5" />
      <circle cx="726" cy="302" r="4" />
      <circle cx="1034" cy="302" r="4" />
    </g>
  </g>
</svg>
