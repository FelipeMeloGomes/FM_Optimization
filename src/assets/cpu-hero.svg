<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="socket" x1="600" y1="205" x2="1110" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263243" />
      <stop offset="0.5" stop-color="#111b29" />
      <stop offset="1" stop-color="#070d16" />
    </linearGradient>
    <linearGradient id="metal" x1="690" y1="250" x2="1020" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1f6fb" />
      <stop offset="0.18" stop-color="#aebbc9" />
      <stop offset="0.45" stop-color="#6d7b8b" />
      <stop offset="0.68" stop-color="#c3ceda" />
      <stop offset="1" stop-color="#4d5a69" />
    </linearGradient>
    <linearGradient id="brushed" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e2e9f0" />
      <stop offset="0.5" stop-color="#8492a2" />
      <stop offset="1" stop-color="#394553" />
    </linearGradient>
    <linearGradient id="substrate" x1="660" y1="230" x2="1070" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c5a56" />
      <stop offset="0.55" stop-color="#0e3534" />
      <stop offset="1" stop-color="#061c20" />
    </linearGradient>
    <linearGradient id="gold" x1="1075" y1="250" x2="1105" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe6a6" />
      <stop offset="0.5" stop-color="#c99c46" />
      <stop offset="1" stop-color="#765a26" />
    </linearGradient>
    <linearGradient id="rim" x1="620" y1="240" x2="1080" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.55" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="ambient" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <pattern id="pins" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="9" height="9" rx="1.5" fill="#d7ae5f" fill-opacity="0.32" />
    </pattern>
    <pattern id="circuit" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 12h8l4-4h12" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1.4" />
      <circle cx="12" cy="8" r="1.4" fill="#67e8f9" fill-opacity="0.35" />
    </pattern>
  </defs>

  <ellipse cx="866" cy="300" rx="290" ry="125" fill="#22d3ee" fill-opacity="0.06" filter="url(#ambient)" />
  <ellipse cx="872" cy="430" rx="270" ry="26" fill="#000814" fill-opacity="0.85" filter="url(#ambient)" />

  <g transform="rotate(-8 860 300)">
    <!-- dissipador atrás do processador -->
    <rect x="614" y="224" width="492" height="154" rx="12" fill="url(#rim)" fill-opacity="0.22" filter="url(#glow)" />
    <g>
      <rect x="620" y="228" width="480" height="20" rx="5" fill="url(#brushed)" stroke="#dbe7f2" stroke-opacity="0.35" />
      <path d="M634 248h452v102H634z" fill="#0a1420" />
      <g fill="url(#brushed)" stroke="#cbd5e1" stroke-opacity="0.3">
        <rect x="636" y="250" width="14" height="98" rx="2" />
        <rect x="658" y="250" width="14" height="98" rx="2" />
        <rect x="680" y="250" width="14" height="98" rx="2" />
        <rect x="702" y="250" width="14" height="98" rx="2" />
        <rect x="724" y="250" width="14" height="98" rx="2" />
        <rect x="746" y="250" width="14" height="98" rx="2" />
        <rect x="768" y="250" width="14" height="98" rx="2" />
        <rect x="790" y="250" width="14" height="98" rx="2" />
        <rect x="812" y="250" width="14" height="98" rx="2" />
        <rect x="834" y="250" width="14" height="98" rx="2" />
        <rect x="856" y="250" width="14" height="98" rx="2" />
        <rect x="878" y="250" width="14" height="98" rx="2" />
        <rect x="900" y="250" width="14" height="98" rx="2" />
        <rect x="922" y="250" width="14" height="98" rx="2" />
        <rect x="944" y="250" width="14" height="98" rx="2" />
        <rect x="966" y="250" width="14" height="98" rx="2" />
        <rect x="988" y="250" width="14" height="98" rx="2" />
        <rect x="1010" y="250" width="14" height="98" rx="2" />
        <rect x="1032" y="250" width="14" height="98" rx="2" />
        <rect x="1054" y="250" width="14" height="98" rx="2" />
      </g>
      <rect x="620" y="340" width="480" height="20" rx="5" fill="url(#brushed)" stroke="#dbe7f2" stroke-opacity="0.35" />
      <rect x="620" y="352" width="480" height="6" rx="3" fill="#22d3ee" fill-opacity="0.55" filter="url(#glow)" />
    </g>

    <!-- soquete -->
    <rect x="590" y="210" width="540" height="190" rx="14" fill="url(#socket)" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2.5" />
    <rect x="602" y="222" width="516" height="166" rx="10" fill="url(#pins)" opacity="0.5" />
    <g fill="#0a1018" stroke="#b9c6d4" stroke-opacity="0.5" stroke-width="2">
      <circle cx="612" cy="232" r="10" />
      <circle cx="1108" cy="232" r="10" />
      <circle cx="612" cy="378" r="10" />
      <circle cx="1108" cy="378" r="10" />
    </g>
    <g stroke="#dbe7f2" stroke-opacity="0.55" stroke-width="2">
      <path d="M606 232h12M1102 232h12M606 378h12M1102 378h12" />
    </g>

    <!-- substrato verde e contatos -->
    <rect x="650" y="232" width="420" height="154" rx="8" fill="url(#substrate)" stroke="#67e8f9" stroke-opacity="0.35" stroke-width="2" />
    <rect x="662" y="244" width="396" height="130" rx="5" fill="url(#circuit)" />
    <rect x="1048" y="246" width="20" height="126" rx="3" fill="url(#gold)" />
    <g stroke="#6d5423" stroke-width="1.5" stroke-opacity="0.75">
      <path d="M1052 252v24M1058 252v24M1064 252v24M1052 292v20M1058 292v20M1064 292v20M1052 330v36M1058 330v36M1064 330v36" />
    </g>
    <rect x="650" y="246" width="14" height="126" rx="3" fill="url(#gold)" fill-opacity="0.85" />

    <!-- tampa metálica (IHS) -->
    <rect x="680" y="250" width="352" height="120" rx="10" fill="url(#metal)" stroke="#e2e8f0" stroke-opacity="0.5" stroke-width="2.5" />
    <rect x="690" y="260" width="332" height="100" rx="7" fill="#1b2530" fill-opacity="0.22" stroke="#0b1118" stroke-opacity="0.5" stroke-width="2" />
    <path d="M690 260h332l-44 40H690z" fill="#ffffff" fill-opacity="0.14" />
    <path d="M1022 360H690l52-44h280z" fill="#000814" fill-opacity="0.18" />
    <circle cx="704" cy="274" r="7" fill="#0a1018" stroke="#b9c6d4" stroke-opacity="0.6" stroke-width="2" />
    <g fill="#0b1118" fill-opacity="0.7" font-family="Arial, Helvetica, sans-serif" font-weight="700">
      <text x="852" y="305" font-size="25" text-anchor="middle" letter-spacing="3">FM 9 950X</text>
      <text x="852" y="330" font-size="13" text-anchor="middle" letter-spacing="2" fill-opacity="0.55">16 CORE · 32 THREAD</text>
    </g>
    <path d="M724 348h256" stroke="#f8fafc" stroke-opacity="0.3" stroke-width="2" />
    <rect x="680" y="250" width="352" height="6" rx="3" fill="#ffffff" fill-opacity="0.45" />
    <rect x="680" y="364" width="352" height="5" rx="2.5" fill="#0a1018" fill-opacity="0.45" />
  </g>
</svg>
