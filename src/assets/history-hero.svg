  <ellipse cx="875" cy="310" rx="300" ry="120" fill="#22d3ee" fill-opacity="0.06" filter="url(#ambient)" />
  <ellipse cx="880" cy="455" rx="275" ry="25" fill="#000814" fill-opacity="0.85" filter="url(#ambient)" />

