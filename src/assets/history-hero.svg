<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="cabinet" x1="670" y1="190" x2="1080" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b4859" />
      <stop offset="0.45" stop-color="#1a2431" />
      <stop offset="1" stop-color="#070d15" />
    </linearGradient>
    <linearGradient id="drawer" x1="700" y1="220" x2="1050" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#344150" />
      <stop offset="0.5" stop-color="#1d2735" />
      <stop offset="1" stop-color="#0a1018" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f5f9" />
      <stop offset="0.6" stop-color="#cbd5e1" />
      <stop offset="1" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e9d39b" />
      <stop offset="0.5" stop-color="#c9a24c" />
      <stop offset="1" stop-color="#8a6a29" />
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f5f9" />
      <stop offset="0.45" stop-color="#8492a2" />
