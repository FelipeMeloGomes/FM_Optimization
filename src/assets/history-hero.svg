      <rect x="826" y="310" width="106" height="20" rx="4" fill="url(#metal)" />
      <rect x="840" y="315" width="78" height="10" rx="3" fill="#1b2635" />
      <circle cx="1048" cy="320" r="4" fill="#4ade80" filter="url(#glow)" />

      <rect x="684" y="356" width="390" height="58" rx="5" fill="url(#drawer)" stroke="#64748b" stroke-opacity="0.5" />
      <rect x="684" y="356" width="390" height="6" rx="3" fill="#ffffff" fill-opacity="0.14" />
      <rect x="826" y="376" width="106" height="20" rx="4" fill="url(#metal)" />
      <rect x="840" y="381" width="78" height="10" rx="3" fill="#1b2635" />
      <circle cx="1048" cy="386" r="4" fill="#8b5cf6" filter="url(#glow)" />
