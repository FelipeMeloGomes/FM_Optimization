    <path d="M676 190h406c14 0 24 10 24 24v14H652v-14c0-14 10-24 24-24z" fill="url(#metal)" fill-opacity="0.22" />
    <path d="M660 206h440" stroke="#ffffff" stroke-opacity="0.15" stroke-width="5" />

