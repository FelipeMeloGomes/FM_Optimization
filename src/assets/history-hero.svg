      <path d="M716 404h84l12 14h104c8 0 14 6 14 14v34c0 8-6 14-14 14H716c-8 0-14-6-14-14v-48c0-8 6-14 14-14z" fill="url(#folder)" stroke="#fde68a" stroke-opacity="0.45" stroke-width="2" />
