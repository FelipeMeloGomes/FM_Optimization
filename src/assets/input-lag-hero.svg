<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="body" x1="650" y1="210" x2="1090" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b4757" />
      <stop offset="0.45" stop-color="#1b2532" />
      <stop offset="1" stop-color="#090f18" />
    </linearGradient>
    <linearGradient id="grip" x1="660" y1="360" x2="1080" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243140" />
      <stop offset="0.5" stop-color="#111a25" />
      <stop offset="1" stop-color="#060b12" />
    </linearGradient>
    <radialGradient id="stick" cx="0" cy="0" r="1" gradientTransform="translate(760 300) rotate(65) scale(48 42)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64748b" />
      <stop offset="0.7" stop-color="#1e293b" />
      <stop offset="1" stop-color="#070c14" />
    </radialGradient>
    <linearGradient id="rgb" x1="640" y1="330" x2="1100" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <filter id="ambient" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <pattern id="texture" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e2e8f0" fill-opacity="0.09" />
    </pattern>
  </defs>

  <ellipse cx="870" cy="300" rx="280" ry="120" fill="#22d3ee" fill-opacity="0.06" filter="url(#ambient)" />
  <ellipse cx="875" cy="445" rx="260" ry="24" fill="#000814" fill-opacity="0.85" filter="url(#ambient)" />

  <g transform="rotate(-7 870 310)">
    <!-- cabo trançado -->
    <path d="M870 196c-14-52 4-92 46-112" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="18" filter="url(#glow)" />
    <path d="M870 196c-14-52 4-92 46-112" stroke="#111a25" stroke-width="14" stroke-linecap="round" />
    <path d="M870 196c-14-52 4-92 46-112" stroke="#64748b" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="7 7" />

    <!-- corpo -->
    <path d="M714 232c26-14 64-22 108-22h96c44 0 82 8 108 22 26 14 44 42 44 78 0 48-12 88-32 112-20 24-52 34-88 30-36-4-60-24-78-48-1-16-2-24-2-24 0 0-1 8-2 24-18 24-42 44-78 48-36 4-68-6-88-30-20-24-32-64-32-112 0-36 18-64 44-78z" fill="url(#body)" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="2.5" />
    <path d="M714 232c26-14 64-22 108-22h96c44 0 82 8 108 22 26 14 44 42 44 78 0 48-12 88-32 112-20 24-52 34-88 30-36-4-60-24-78-48-1-16-2-24-2-24 0 0-1 8-2 24-18 24-42 44-78 48-36 4-68-6-88-30-20-24-32-64-32-112 0-36 18-64 44-78z" fill="url(#texture)" />
    <path d="M700 254c34-22 94-34 170-34s136 12 170 34c-38-12-100-18-170-18s-132 6-170 18z" fill="#e2e8f0" fill-opacity="0.12" />

    <!-- alças inferiores -->
    <path d="M654 358c-6 44 4 74 32 88 24 12 52 6 70-14 12-14 18-32 20-48-30 16-60 22-122 22z" fill="url(#grip)" stroke="#64748b" stroke-opacity="0.3" />
    <path d="M1086 358c6 44-4 74-32 88-24 12-52 6-70-14-12-14-18-32-20-48 30 16 60 22 122 22z" fill="url(#grip)" stroke="#64748b" stroke-opacity="0.3" />

    <!-- faixa RGB -->
    <rect x="788" y="218" width="164" height="12" rx="6" fill="url(#rgb)" filter="url(#glow)" />
    <rect x="788" y="218" width="164" height="12" rx="6" fill="url(#rgb)" />
    <rect x="792" y="220" width="156" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.5" />

    <!-- D-pad -->
    <g fill="#0b1118" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="2">
      <path d="M726 292h22v-22h22v22h22v22h-22v22h-22v-22h-22z" />
    </g>
    <path d="M748 270v22h22" stroke="#e2e8f0" stroke-opacity="0.2" stroke-width="3" fill="none" />

    <!-- analógicos -->
    <g>
      <circle cx="782" cy="352" r="34" fill="#060b12" stroke="#64748b" stroke-width="3" />
      <circle cx="782" cy="352" r="25" fill="url(#stick)" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2" />
      <circle cx="782" cy="352" r="15" fill="#0a1018" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1.5" />
      <path d="M774 344c6-5 14-5 20 0" stroke="#e2e8f0" stroke-opacity="0.35" stroke-width="2" fill="none" />
      <circle cx="958" cy="352" r="34" fill="#060b12" stroke="#64748b" stroke-width="3" />
      <circle cx="958" cy="352" r="25" fill="url(#stick)" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="2" />
      <circle cx="958" cy="352" r="15" fill="#0a1018" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="1.5" />
    </g>

    <!-- botões de ação -->
    <g stroke="#e2e8f0" stroke-opacity="0.35" stroke-width="2">
      <circle cx="1038" cy="278" r="14" fill="#22d3ee" fill-opacity="0.75" />
      <circle cx="1004" cy="306" r="14" fill="#8b5cf6" fill-opacity="0.75" />
      <circle cx="1072" cy="306" r="14" fill="#f472b6" fill-opacity="0.7" />
      <circle cx="1038" cy="334" r="14" fill="#4ade80" fill-opacity="0.72" />
    </g>
    <g fill="#ffffff" fill-opacity="0.45" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">
      <text x="1038" y="282">Y</text>
      <text x="1004" y="310">X</text>
      <text x="1072" y="310">B</text>
      <text x="1038" y="338">A</text>
    </g>

    <!-- botões de sistema -->
    <rect x="836" y="276" width="26" height="7" rx="3.5" fill="#94a3b8" fill-opacity="0.6" />
    <rect x="906" y="276" width="26" height="7" rx="3.5" fill="#94a3b8" fill-opacity="0.6" />
  </g>
</svg>
