<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="hub" x1="650" y1="250" x2="1100" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a4758" />
      <stop offset="0.45" stop-color="#1a2634" />
      <stop offset="1" stop-color="#080e17" />
    </linearGradient>
    <linearGradient id="top" x1="660" y1="248" x2="1080" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#546377" />
      <stop offset="0.5" stop-color="#2b3849" />
      <stop offset="1" stop-color="#111a26" />
    </linearGradient>
    <linearGradient id="rim" x1="640" y1="390" x2="1090" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="button" cx="0" cy="0" r="1" gradientTransform="translate(0 0) scale(30)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64748b" />
      <stop offset="0.65" stop-color="#1e293b" />
      <stop offset="1" stop-color="#070c14" />
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <filter id="ambient" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <ellipse cx="870" cy="300" rx="290" ry="120" fill="#22d3ee" fill-opacity="0.06" filter="url(#ambient)" />
  <ellipse cx="875" cy="430" rx="265" ry="24" fill="#000814" fill-opacity="0.85" filter="url(#ambient)" />

  <g transform="rotate(-6 870 320)">
    <!-- cabos trançados saindo do hub -->
    <path d="M640 300c-52-12-78 18-84 66" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="16" filter="url(#glow)" />
    <path d="M640 300c-52-12-78 18-84 66" stroke="#0b121b" stroke-width="12" stroke-linecap="round" />
    <path d="M640 300c-52-12-78 18-84 66" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6" />
    <path d="M1100 286c54-16 84 14 90 62" stroke="#a855f7" stroke-opacity="0.22" stroke-width="16" filter="url(#glow)" />
    <path d="M1100 286c54-16 84 14 90 62" stroke="#0b121b" stroke-width="12" stroke-linecap="round" />
    <path d="M1100 286c54-16 84 14 90 62" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 6" />

    <!-- corpo do hub -->
    <path d="M650 262c0-14 12-24 26-24h388c14 0 26 10 26 24v116c0 14-12 24-26 24H676c-14 0-26-10-26-24z" fill="url(#hub)" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="2.5" />
    <path d="M676 238h388c14 0 26 10 26 24v22H650v-22c0-14 12-24 26-24z" fill="url(#top)" />
    <path d="M676 242h388c10 0 18 5 22 14H654c4-9 12-14 22-14z" fill="#ffffff" fill-opacity="0.13" />
    <rect x="650" y="356" width="440" height="12" rx="6" fill="url(#rim)" filter="url(#glow)" />
    <rect x="650" y="356" width="440" height="12" rx="6" fill="url(#rim)" />
    <rect x="656" y="358" width="428" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.45" />

    <!-- botões com anéis RGB -->
    <g>
      <circle cx="724" cy="310" r="28" fill="#22d3ee" fill-opacity="0.28" filter="url(#glow)" />
      <circle cx="724" cy="310" r="24" fill="#060b12" stroke="url(#rim)" stroke-width="3" />
      <circle cx="724" cy="310" r="16" fill="url(#button)" stroke="#94a3b8" stroke-opacity="0.4" />
      <path d="M717 310h14" stroke="#e2e8f0" stroke-opacity="0.5" stroke-width="2" />
      <circle cx="810" cy="310" r="28" fill="#22d3ee" fill-opacity="0.28" filter="url(#glow)" />
      <circle cx="810" cy="310" r="24" fill="#060b12" stroke="url(#rim)" stroke-width="3" />
      <circle cx="810" cy="310" r="16" fill="url(#button)" stroke="#94a3b8" stroke-opacity="0.4" />
      <path d="M803 303l14 14M817 303l-14 14" stroke="#e2e8f0" stroke-opacity="0.5" stroke-width="2" />
      <circle cx="896" cy="310" r="28" fill="#a855f7" fill-opacity="0.28" filter="url(#glow)" />
      <circle cx="896" cy="310" r="24" fill="#060b12" stroke="url(#rim)" stroke-width="3" />
      <circle cx="896" cy="310" r="16" fill="url(#button)" stroke="#94a3b8" stroke-opacity="0.4" />
      <path d="M889 310h14" stroke="#e2e8f0" stroke-opacity="0.5" stroke-width="2" />
      <circle cx="982" cy="310" r="28" fill="#a855f7" fill-opacity="0.28" filter="url(#glow)" />
      <circle cx="982" cy="310" r="24" fill="#060b12" stroke="url(#rim)" stroke-width="3" />
      <circle cx="982" cy="310" r="16" fill="url(#button)" stroke="#94a3b8" stroke-opacity="0.4" />
      <circle cx="982" cy="310" r="5" fill="#22d3ee" fill-opacity="0.8" />
    </g>

    <!-- conectores e detalhes -->
    <g fill="#0b1118" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.5">
      <rect x="1040" y="292" width="30" height="34" rx="4" />
      <rect x="1046" y="298" width="18" height="10" rx="2" fill="#1e293b" />
      <rect x="1046" y="312" width="18" height="6" rx="2" fill="#1e293b" />
      <rect x="670" y="292" width="22" height="34" rx="4" />
    </g>
    <g fill="#22d3ee">
      <circle cx="1055" cy="290" r="3" />
      <circle cx="1065" cy="290" r="3" />
      <circle cx="681" cy="290" r="3" />
    </g>
    <path d="M744 344h220" stroke="#e2e8f0" stroke-opacity="0.12" stroke-width="2" />
  </g>
</svg>
