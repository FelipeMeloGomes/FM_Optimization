<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="panel" x1="650" y1="210" x2="1090" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a4656" />
      <stop offset="0.45" stop-color="#18222f" />
      <stop offset="1" stop-color="#070d15" />
    </linearGradient>
    <linearGradient id="face" x1="670" y1="240" x2="1070" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2b3848" />
      <stop offset="0.5" stop-color="#141e2a" />
      <stop offset="1" stop-color="#080e16" />
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f5f9" />
      <stop offset="0.45" stop-color="#8492a2" />
      <stop offset="1" stop-color="#3c4958" />
    </linearGradient>
    <linearGradient id="rgb" x1="650" y1="420" x2="1090" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <filter id="ambient" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="2" fill="#03070d" fill-opacity="0.8" />
    </pattern>
  </defs>

  <ellipse cx="875" cy="310" rx="300" ry="120" fill="#22d3ee" fill-opacity="0.06" filter="url(#ambient)" />
  <ellipse cx="880" cy="450" rx="280" ry="25" fill="#000814" fill-opacity="0.85" filter="url(#ambient)" />

  <g transform="rotate(-5 880 320)">
    <!-- console -->
    <path d="M650 218h462c16 0 28 12 28 28v164c0 16-12 28-28 28H650c-16 0-28-12-28-28V246c0-16 12-28 28-28z" fill="url(#panel)" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="2.5" />
    <path d="M650 218h462c16 0 28 12 28 28v18H622v-18c0-16 12-28 28-28z" fill="url(#metal)" fill-opacity="0.22" />
    <rect x="632" y="250" width="498" height="166" rx="8" fill="url(#face)" stroke="#64748b" stroke-opacity="0.5" stroke-width="2" />
    <path d="M632 250h498v10H632z" fill="#ffffff" fill-opacity="0.1" />

    <!-- display -->
    <rect x="654" y="270" width="176" height="96" rx="6" fill="#0a1018" stroke="url(#rgb)" stroke-opacity="0.5" stroke-width="2" />
    <rect x="662" y="278" width="160" height="80" rx="4" fill="url(#mesh)" />
    <text x="742" y="316" fill="#67e8f9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="2">SETTINGS</text>
    <text x="742" y="338" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle" letter-spacing="2">FM OPTIMIZE</text>
    <rect x="662" y="346" width="160" height="5" rx="2.5" fill="url(#rgb)" />

    <!-- botões -->
    <g>
      <circle cx="884" cy="292" r="22" fill="#0a1018" stroke="url(#metal)" stroke-width="3" />
      <circle cx="884" cy="292" r="22" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="7" filter="url(#glow)" />
      <path d="M874 292h20M884 282v20" stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="950" cy="292" r="22" fill="#0a1018" stroke="url(#metal)" stroke-width="3" />
      <circle cx="950" cy="292" r="22" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="7" filter="url(#glow)" />
      <path d="M940 292h20" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="1016" cy="292" r="22" fill="#0a1018" stroke="url(#metal)" stroke-width="3" />
      <circle cx="1016" cy="292" r="22" stroke="#4ade80" stroke-opacity="0.5" stroke-width="7" filter="url(#glow)" />
      <path d="l-6 0 6-8 6 8z" transform="translate(1016 298)" fill="#86efac" />
    </g>

    <!-- sliders -->
    <g>
      <rect x="866" y="344" width="174" height="8" rx="4" fill="#0a1018" stroke="#94a3b8" stroke-opacity="0.4" />
      <rect x="866" y="344" width="96" height="8" rx="4" fill="url(#rgb)" />
      <circle cx="962" cy="348" r="10" fill="url(#metal)" stroke="#0a1018" stroke-width="2" />
      <rect x="866" y="374" width="174" height="8" rx="4" fill="#0a1018" stroke="#94a3b8" stroke-opacity="0.4" />
      <rect x="866" y="374" width="132" height="8" rx="4" fill="url(#rgb)" fill-opacity="0.75" />
      <circle cx="998" cy="378" r="10" fill="url(#metal)" stroke="#0a1018" stroke-width="2" />
    </g>

    <!-- LEDs de estado -->
    <g>
      <circle cx="662" cy="392" r="5" fill="#22d3ee" filter="url(#glow)" />
      <circle cx="680" cy="392" r="5" fill="#4ade80" filter="url(#glow)" />
      <circle cx="698" cy="392" r="5" fill="#a855f7" filter="url(#glow)" />
      <circle cx="716" cy="392" r="5" fill="#c9a24c" />
    </g>
    <rect x="632" y="420" width="498" height="7" rx="3.5" fill="url(#rgb)" fill-opacity="0.7" />
    <g fill="#0a1018" stroke="url(#metal)" stroke-width="2">
      <circle cx="642" cy="264" r="6" />
      <circle cx="1120" cy="264" r="6" />
      <circle cx="642" cy="404" r="6" />
      <circle cx="1120" cy="404" r="6" />
    </g>
  </g>
</svg>
