<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="can" x1="690" y1="230" x2="1040" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8eef5" />
      <stop offset="0.22" stop-color="#a9b7c6" />
      <stop offset="0.5" stop-color="#5d6c7d" />
      <stop offset="0.72" stop-color="#cbd5e1" />
      <stop offset="1" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="label" x1="710" y1="290" x2="1020" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123a3c" />
      <stop offset="0.5" stop-color="#0c2a2d" />
      <stop offset="1" stop-color="#07171f" />
    </linearGradient>
    <linearGradient id="nozzle" x1="820" y1="180" x2="900" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1f5f9" />
      <stop offset="0.5" stop-color="#8492a2" />
      <stop offset="1" stop-color="#3c4958" />
    </linearGradient>
    <linearGradient id="jet" x1="840" y1="220" x2="1080" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0.65" />
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rgb" x1="700" y1="410" x2="1040" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <filter id="ambient" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <pattern id="mist" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#a5f3fc" fill-opacity="0.35" />
      <circle cx="13" cy="12" r="1.3" fill="#e0f2fe" fill-opacity="0.25" />
    </pattern>
  </defs>

  <ellipse cx="870" cy="310" rx="290" ry="120" fill="#22d3ee" fill-opacity="0.06" filter="url(#ambient)" />
  <ellipse cx="875" cy="445" rx="265" ry="24" fill="#000814" fill-opacity="0.85" filter="url(#ambient)" />

  <g transform="rotate(-7 870 320)">
    <!-- jato de ar -->
    <path d="M864 204c64-34 132-40 210-16" stroke="url(#jet)" stroke-width="42" stroke-linecap="round" filter="url(#glow)" />
    <path d="M864 204c64-34 132-40 210-16" stroke="url(#jet)" stroke-width="16" stroke-linecap="round" />
    <path d="M900 194c60-26 120-28 180-8" fill="url(#mist)" opacity="0.7" />
    <g fill="#a5f3fc" fill-opacity="0.6">
      <circle cx="944" cy="184" r="3" />
      <circle cx="990" cy="176" r="2.5" />
      <circle cx="1038" cy="174" r="2" />
    </g>

    <!-- bico -->
    <path d="M826 210l44-22 30 28-46 24z" fill="url(#nozzle)" stroke="#e2e8f0" stroke-opacity="0.5" stroke-width="2" />
    <path d="M830 212l38-18 8 8-38 20z" fill="#ffffff" fill-opacity="0.35" />
    <path d="M870 188l32 30-12 8-32-30z" fill="#1b2635" stroke="#94a3b8" stroke-opacity="0.5" />

    <!-- corpo da lata -->
    <path d="M700 246h266c22 0 38 16 38 38v112c0 22-16 38-38 38H700c-22 0-38-16-38-38V284c0-22 16-38 38-38z" fill="url(#can)" stroke="#e2e8f0" stroke-opacity="0.45" stroke-width="2.5" />
    <ellipse cx="833" cy="246" rx="133" ry="30" fill="#cbd5e1" stroke="#f1f5f9" stroke-opacity="0.6" stroke-width="2" />
    <ellipse cx="833" cy="246" rx="104" ry="20" fill="#64748b" />
    <ellipse cx="833" cy="244" rx="88" ry="15" fill="#1b2635" />
    <ellipse cx="833" cy="242" rx="26" ry="7" fill="#0a1018" />
    <path d="M700 246h266c22 0 38 16 38 38v16H662v-16c0-22 16-38 38-38z" fill="#ffffff" fill-opacity="0.18" />
    <path d="M668 300h330" stroke="#ffffff" stroke-opacity="0.3" stroke-width="5" />

    <!-- etiqueta -->
    <rect x="692" y="306" width="282" height="86" rx="8" fill="url(#label)" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="2" />
    <rect x="692" y="306" width="282" height="7" rx="3.5" fill="url(#rgb)" />
    <text x="833" y="344" fill="#e0f2fe" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="4">AIR DUSTER</text>
    <text x="833" y="368" fill="#67e8f9" fill-opacity="0.8" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" letter-spacing="2">COMPRESSED AIR · 400 ml</text>
    <path d="M714 380h238" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="2" />

    <!-- reflexos e base -->
    <path d="M684 282c30-14 70-18 116-18" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" />
    <path d="M686 410c40 12 190 12 294 0" stroke="#000814" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round" />
    <rect x="664" y="432" width="340" height="6" rx="3" fill="url(#rgb)" fill-opacity="0.5" />
  </g>
</svg>
