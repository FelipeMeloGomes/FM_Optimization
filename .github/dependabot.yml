version: 2
updates:
  # Atualizações de dependências do pacote (bun) — semanalmente
  # Nota: o GitHub suporta o ecossistema "bun" para atualizações de versão.
  # Atualizações de segurança (Dependabot alerts) não são suportadas para bun;
  # por isso o `overrides` do package.json e o `bun audit` são a rede de proteção.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
      runtime-dependencies:
        dependency-type: "production"

  # Atualizações de workflows do GitHub Actions — semanalmente
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
