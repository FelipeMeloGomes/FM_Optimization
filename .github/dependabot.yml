version: 2
updates:
  # Atualizações de dependências do pacote (bun) — todos os dias
  # Nota: o GitHub suporta o ecossistema "bun" para atualizações de versão.
  # Atualizações de segurança (Dependabot alerts) não são suportadas para bun;
  # por isso o `overrides` do package.json e o `bun audit` são a rede de proteção.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
      runtime-dependencies:
        dependency-type: "production"

  # Atualizações de workflows do GitHub Actions — todos os dias
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
